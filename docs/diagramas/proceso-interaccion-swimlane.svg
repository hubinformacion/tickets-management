<svg viewBox="0 0 1180 650" width="1180" height="650" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="swimlane-title swimlane-desc">
  <title id="swimlane-title">Diagrama Swimlane del Proceso de Tickets</title>
  <desc id="swimlane-desc">Diagrama Swimlane mostrando la interacción entre Usuario, Plataforma Next.js 16, Agente de Atención y Proveedor Externo.</desc>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
    
    .bg { fill: #f5f5f5; }
    .lane-divider-main { stroke: rgba(79, 93, 117, 0.25); stroke-width: 1.2; }
    .lane-divider { stroke: rgba(45, 49, 66, 0.12); stroke-width: 1; }
    .actor-mask { fill: #f5f5f5; opacity: 0.85; }
    .node-base { fill: #ffffff; stroke: #2d3142; stroke-width: 1.2; }
    .node-neutral { fill: #ececec; stroke: #7a8399; stroke-width: 1.2; }
    .node-focal { fill: rgba(235,108,54,0.08); stroke: #eb6c36; stroke-width: 1.5; }
    .node-provider { fill: rgba(45,49,66,0.03); stroke: #2e5aa8; stroke-dasharray: 4,3; stroke-width: 1.2; }
    .label-mask { fill: #f5f5f5; rx: 3px; }
  </style>

  <defs>
    <pattern id="dots-swim" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="rgba(79,93,117,0.25)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>

  <rect width="1180" height="650" class="bg"/>
  <rect width="1180" height="650" fill="url(#dots-swim)" opacity="0.35"/>

  <!-- Líneas divisorias de Carriles -->
  <line x1="30" y1="60" x2="1150" y2="60" class="lane-divider-main"/>
  <line x1="30" y1="200" x2="1150" y2="200" class="lane-divider"/>
  <line x1="30" y1="340" x2="1150" y2="340" class="lane-divider"/>
  <line x1="30" y1="480" x2="1150" y2="480" class="lane-divider"/>
  <line x1="30" y1="620" x2="1150" y2="620" class="lane-divider-main"/>
  <line x1="160" y1="60" x2="160" y2="620" class="lane-divider-main"/>

  <!-- Etiquetas de Carriles (Actores) -->
  <!-- Lane 1: Usuario -->
  <rect x="35" y="65" width="120" height="130" class="actor-mask"/>
  <text x="45" y="115" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="0.14em" fill="#2d3142">USUARIO</text>
  <text x="45" y="130" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399">SOLICITANTE</text>
  <text x="45" y="150" font-family="'Geist Mono', monospace" font-size="7" fill="#4f5d75">Role: 'user'</text>

  <!-- Lane 2: Plataforma -->
  <rect x="35" y="205" width="120" height="130" class="actor-mask"/>
  <text x="45" y="255" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="0.14em" fill="#eb6c36">PLATAFORMA</text>
  <text x="45" y="270" font-family="'Geist Mono', monospace" font-size="7.5" fill="#eb6c36">NEXT.JS 16 CORE</text>
  <text x="45" y="290" font-family="'Geist Mono', monospace" font-size="7" fill="#4f5d75">Actions &amp; Crons</text>

  <!-- Lane 3: Agente -->
  <rect x="35" y="345" width="120" height="130" class="actor-mask"/>
  <text x="45" y="395" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="0.14em" fill="#2d3142">AGENTE</text>
  <text x="45" y="410" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399">DE ATENCIÓN</text>
  <text x="45" y="430" font-family="'Geist Mono', monospace" font-size="7" fill="#4f5d75">TSI · DIF · FED</text>

  <!-- Lane 4: Proveedor -->
  <rect x="35" y="485" width="120" height="130" class="actor-mask"/>
  <text x="45" y="535" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="0.14em" fill="#2e5aa8">PROVEEDOR</text>
  <text x="45" y="550" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399">EXTERNO</text>
  <text x="45" y="570" font-family="'Geist Mono', monospace" font-size="7" fill="#4f5d75">SLA &amp; Terceros</text>

  <!-- Conectores -->
  <g class="connectors" fill="none">
    <path d="M 285,130 H 325" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 395,175 V 225" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <path d="M 465,270 H 500" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 570,315 V 365" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 640,430 V 505" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
    <path d="M 750,505 V 455" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
    <path d="M 800,365 V 175" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <path d="M 870,130 H 915" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 1035,130 H 1055" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <path d="M 800,105 Q 800,85 750,85 H 685 Q 675,85 675,95 V 365" stroke="#7a8399" stroke-width="1.1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  </g>

  <!-- Etiquetas de Conectores -->
  <g class="labels">
    <rect x="360" y="190" width="70" height="14" class="label-mask"/>
    <text x="395" y="200" font-family="'Geist Mono', monospace" font-size="7.2" font-weight="600" fill="#eb6c36" text-anchor="middle">SUBMIT FORM</text>

    <rect x="535" y="330" width="70" height="14" class="label-mask"/>
    <text x="570" y="340" font-family="'Geist Mono', monospace" font-size="7.2" font-weight="600" fill="#4f5d75" text-anchor="middle">MAIL &amp; QUEUE</text>

    <rect x="610" y="458" width="60" height="14" class="label-mask"/>
    <text x="640" y="468" font-family="'Geist Mono', monospace" font-size="7.2" font-weight="600" fill="#2e5aa8" text-anchor="middle">DERIVACIÓN</text>

    <rect x="765" y="255" width="70" height="14" class="label-mask"/>
    <text x="800" y="265" font-family="'Geist Mono', monospace" font-size="7.2" font-weight="600" fill="#eb6c36" text-anchor="middle">VALIDACIÓN</text>

    <rect x="700" y="78" width="55" height="13" class="label-mask"/>
    <text x="727" y="87" font-family="'Geist Mono', monospace" font-size="6.8" font-weight="600" fill="#7a8399" text-anchor="middle">RECHAZO</text>
  </g>

  <!-- Pasos Lane 1: Usuario -->
  <g id="step-u1">
    <rect x="180" y="85" width="105" height="90" rx="6" class="node-base"/>
    <text x="190" y="103" font-family="'Geist Mono', monospace" font-size="7" font-weight="600" fill="#7a8399">PASO 1</text>
    <text x="190" y="121" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">Clasificación</text>
    <text x="190" y="138" font-family="'Geist Mono', monospace" font-size="7.8" fill="#4f5d75">Área → Categoría</text>
    <text x="190" y="153" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399">Subcategoría</text>
    <text x="190" y="166" font-family="'Geist Mono', monospace" font-size="7" fill="#eb6c36">Classification-First</text>
  </g>

  <g id="step-u2">
    <rect x="325" y="85" width="115" height="90" rx="6" class="node-base"/>
    <text x="335" y="103" font-family="'Geist Mono', monospace" font-size="7" font-weight="600" fill="#7a8399">PASO 2</text>
    <text x="335" y="121" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">Detalle Ticket</text>
    <text x="335" y="138" font-family="'Geist Mono', monospace" font-size="7.8" fill="#4f5d75">Título, Descripción</text>
    <text x="335" y="153" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399">TipTap Editor</text>
    <text x="335" y="166" font-family="'Geist Mono', monospace" font-size="7" fill="#2d3142">Prioridad + Archivos</text>
  </g>

  <g id="step-u3">
    <rect x="745" y="85" width="125" height="90" rx="6" class="node-focal"/>
    <text x="755" y="103" font-family="'Geist Mono', monospace" font-size="7" font-weight="700" fill="#eb6c36">PASO 6 · FOCAL</text>
    <text x="755" y="121" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">Validar Solución</text>
    <text x="755" y="138" font-family="'Geist Mono', monospace" font-size="7.8" fill="#4f5d75">¿Resuelve el caso?</text>
    <text x="755" y="153" font-family="'Geist Mono', monospace" font-size="7.5" fill="#2d3142">[Aprobar] | [Rechazar]</text>
    <text x="755" y="166" font-family="'Geist Mono', monospace" font-size="7" fill="#7a8399">Reapertura inmediata</text>
  </g>

  <g id="step-u4">
    <rect x="915" y="85" width="120" height="90" rx="6" class="node-base"/>
    <text x="925" y="103" font-family="'Geist Mono', monospace" font-size="7" font-weight="600" fill="#7a8399">PASO 7 · FINAL</text>
    <text x="925" y="121" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">Encuesta CSAT</text>
    <text x="925" y="138" font-family="'Geist Mono', monospace" font-size="7.8" fill="#4f5d75">1 a 5 Estrellas (★)</text>
    <text x="925" y="153" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399">4 Criterios + Texto</text>
    <text x="925" y="166" font-family="'Geist Mono', monospace" font-size="7" fill="#eb6c36">Solo área TSI</text>
  </g>

  <!-- Pasos Lane 2: Plataforma -->
  <g id="step-p1">
    <rect x="325" y="225" width="140" height="90" rx="6" class="node-focal"/>
    <text x="335" y="243" font-family="'Geist Mono', monospace" font-size="7" font-weight="700" fill="#eb6c36">PASO 3 · ATÓMICO</text>
    <text x="335" y="261" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">Generar Secuencia</text>
    <text x="335" y="278" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">{SLUG}-{YYYY}-{SEQ}</text>
    <text x="335" y="293" font-family="'Geist Mono', monospace" font-size="7.5" fill="#4f5d75">ticket_sequence counter</text>
    <text x="335" y="306" font-family="'Geist Mono', monospace" font-size="7" fill="#7a8399">Status: 'open'</text>
  </g>

  <g id="step-p2">
    <rect x="500" y="225" width="140" height="90" rx="6" class="node-base"/>
    <text x="510" y="243" font-family="'Geist Mono', monospace" font-size="7" font-weight="600" fill="#7a8399">PASO 4 · ASYNC</text>
    <text x="510" y="261" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">Notificaciones</text>
    <text x="510" y="278" font-family="'Geist Mono', monospace" font-size="7.8" fill="#4f5d75">Next.js 16 after()</text>
    <text x="510" y="293" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399">Gmail API Threading</text>
    <text x="510" y="306" font-family="'Geist Mono', monospace" font-size="7" fill="#2e5aa8">Drive Upload Stream</text>
  </g>

  <g id="step-p3">
    <rect x="915" y="225" width="120" height="90" rx="6" class="node-neutral"/>
    <text x="925" y="243" font-family="'Geist Mono', monospace" font-size="7" font-weight="600" fill="#7a8399">AUTOMATIZACIÓN</text>
    <text x="925" y="261" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">Cron Auto-Close</text>
    <text x="925" y="278" font-family="'Geist Mono', monospace" font-size="7.8" fill="#4f5d75">Cierre tras 7 días</text>
    <text x="925" y="293" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399">closedBy: 'system'</text>
    <text x="925" y="306" font-family="'Geist Mono', monospace" font-size="7" fill="#2d3142">Recordatorio Survey</text>
  </g>

  <!-- Pasos Lane 3: Agente -->
  <g id="step-a1">
    <rect x="500" y="365" width="140" height="90" rx="6" class="node-base"/>
    <text x="510" y="383" font-family="'Geist Mono', monospace" font-size="7" font-weight="600" fill="#7a8399">PASO 5 · ATENCIÓN</text>
    <text x="510" y="401" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">Diagnóstico &amp; SLA</text>
    <text x="510" y="418" font-family="'Geist Mono', monospace" font-size="7.8" fill="#4f5d75">Asignar Agente</text>
    <text x="510" y="433" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399">Status: 'in_progress'</text>
    <text x="510" y="446" font-family="'Geist Mono', monospace" font-size="7" fill="#2d3142">Comentarios en Vivo</text>
  </g>

  <g id="step-a2">
    <rect x="745" y="365" width="125" height="90" rx="6" class="node-base"/>
    <text x="755" y="383" font-family="'Geist Mono', monospace" font-size="7" font-weight="600" fill="#7a8399">RESOLUCIÓN</text>
    <text x="755" y="401" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">Cierre Técnico</text>
    <text x="755" y="418" font-family="'Geist Mono', monospace" font-size="7.8" fill="#4f5d75">Informe de solución</text>
    <text x="755" y="433" font-family="'Geist Mono', monospace" font-size="7.5" fill="#eb6c36">pending_validation</text>
    <text x="755" y="446" font-family="'Geist Mono', monospace" font-size="7" fill="#7a8399">Disparo de Email</text>
  </g>

  <!-- Pasos Lane 4: Proveedor -->
  <g id="step-pr1">
    <rect x="585" y="505" width="130" height="95" rx="6" class="node-provider"/>
    <text x="595" y="523" font-family="'Geist Mono', monospace" font-size="7" font-weight="600" fill="#2e5aa8">DERIVACIÓN EXTERNA</text>
    <text x="595" y="541" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">Crear Ticket Prov.</text>
    <text x="595" y="558" font-family="'Geist Mono', monospace" font-size="7.8" fill="#4f5d75">external_code manual</text>
    <text x="595" y="573" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399">Timeline: banner ámbar</text>
    <text x="595" y="586" font-family="'Geist Mono', monospace" font-size="7" fill="#2e5aa8">Status: 'en_proceso'</text>
  </g>

  <g id="step-pr2">
    <rect x="735" y="505" width="135" height="95" rx="6" class="node-provider"/>
    <text x="745" y="523" font-family="'Geist Mono', monospace" font-size="7" font-weight="600" fill="#2e5aa8">ENTREGA Y CSAT</text>
    <text x="745" y="541" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">Cierre Proveedor</text>
    <text x="745" y="558" font-family="'Geist Mono', monospace" font-size="7.8" fill="#4f5d75">Status: 'cerrado'</text>
    <text x="745" y="573" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399">provider_survey (1-5)</text>
    <text x="745" y="586" font-family="'Geist Mono', monospace" font-size="7" fill="#2d3142">Retorno a flujo interno</text>
  </g>
</svg>
