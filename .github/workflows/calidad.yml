name: Calidad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calidad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, lint y build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:1/fixture
      BETTER_AUTH_SECRET: fixture-secret-000000000000000000000000000
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: fixture
      GOOGLE_CLIENT_SECRET: fixture
      CRON_SECRET: fixture-cron
      NODE_OPTIONS: --max-old-space-size=3072
      # Next.js 16.4.3 calcula dos workers a partir de este valor.
      CIRCLE_NODE_TOTAL: '3'
      UV_THREADPOOL_SIZE: '2'
    steps:
      - name: Obtener código sin guardar credenciales
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Preparar pnpm sin instalación automática
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.3.0'
          run_install: false
          cache: false
      - name: Instalar dependencias desde el lockfile
        env:
          PNPM_CONFIG_IGNORE_SCRIPTS: 'true'
          PNPM_CONFIG_IGNORE_PNPMFILE: 'true'
          PNPM_CONFIG_FROZEN_LOCKFILE: 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - name: Verificar tipos
        env:
          PNPM_CONFIG_IGNORE_SCRIPTS: 'true'
          PNPM_CONFIG_IGNORE_PNPMFILE: 'true'
          PNPM_CONFIG_FROZEN_LOCKFILE: 'true'
        run: pnpm exec tsc --noEmit --incremental false
      - name: Verificar ESLint
        env:
          PNPM_CONFIG_IGNORE_SCRIPTS: 'true'
          PNPM_CONFIG_IGNORE_PNPMFILE: 'true'
          PNPM_CONFIG_FROZEN_LOCKFILE: 'true'
        run: pnpm exec eslint . --max-warnings 0
      - name: Compilar para producción con configuración ficticia
        env:
          PNPM_CONFIG_IGNORE_SCRIPTS: 'true'
          PNPM_CONFIG_IGNORE_PNPMFILE: 'true'
          PNPM_CONFIG_FROZEN_LOCKFILE: 'true'
        run: pnpm build
